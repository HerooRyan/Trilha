name = "trilha-ai"
main = "ai-worker.js"
compatibility_date = "2026-10-27"

[vars]
ALLOWED_ORIGIN = "https://herooryan.github.io"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"

[ai]
binding = "AI"

[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "619274"

  [ratelimits.simple]
  limit = 12
  period = 60

[[ratelimits]]
name = "SITE_LIMITER"
namespace_id = "619275"

  [ratelimits.simple]
  limit = 40
  period = 60
